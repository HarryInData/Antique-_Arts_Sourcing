name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Verification & Hostinger Auto-Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Production Build Verification
        run: npm run build

      - name: Create Clean Source Zip Archive
        run: |
          git archive -o source.zip HEAD

      - name: Deploy to Hostinger JS Hosting
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          DOMAIN: "antiqueartssourcing.com"
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ]; then
            echo "ERROR: HOSTINGER_API_TOKEN secret is not set in GitHub repository secrets."
            echo "Please add your Hostinger API Token to GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Deploying source.zip to Hostinger for domain $DOMAIN..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.hostinger.com/v1/hosting/js-deployments" \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            -F "domain=$DOMAIN" \
            -F "file=@source.zip")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "Hostinger API Response Code: $HTTP_CODE"
          echo "Hostinger API Response: $BODY"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Successfully triggered Hostinger Auto-Deployment!"
          else
            echo "Deployment failed with HTTP code $HTTP_CODE"
            exit 1
          fi
