name: Hostinger Auto-Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Trigger Hostinger Deployment API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Clean Source Zip Archive
        run: git archive -o source.zip HEAD

      - name: Deploy to Hostinger JS Hosting
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          DOMAIN: "antiqueartssourcing.com"
        run: |
          if [ -z "$HOSTINGER_API_TOKEN" ]; then
            echo "::error::HOSTINGER_API_TOKEN is missing in GitHub Secrets!"
            echo "Please add HOSTINGER_API_TOKEN under GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Uploading source.zip and triggering Hostinger Deployment API for $DOMAIN..."
          curl -s -X POST "https://api.hostinger.com/v1/hosting/js-deployments" \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            -F "domain=$DOMAIN" \
            -F "file=@source.zip"
