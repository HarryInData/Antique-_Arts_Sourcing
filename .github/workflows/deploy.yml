name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Next.js Build
        run: npm run build

      - name: Create Clean Source Zip Archive
        run: git archive -o source.zip HEAD

      - name: Setup SSH Agent & Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: Deploy to Hostinger Server via SSH
        env:
          HOSTINGER_HOST: "217.21.90.210"
          HOSTINGER_PORT: "65002"
          HOSTINGER_USER: "u689912606"
          DOMAIN: "antiqueartssourcing.com"
        run: |
          echo "Adding Hostinger server to known_hosts..."
          mkdir -p ~/.ssh
          ssh-keyscan -p $HOSTINGER_PORT -H $HOSTINGER_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          echo "Uploading source archive to Hostinger server..."
          scp -P $HOSTINGER_PORT source.zip ${HOSTINGER_USER}@${HOSTINGER_HOST}:/home/${HOSTINGER_USER}/domains/${DOMAIN}/

          echo "Extracting and restarting application on Hostinger..."
          ssh -p $HOSTINGER_PORT ${HOSTINGER_USER}@${HOSTINGER_HOST} "
            cd /home/${HOSTINGER_USER}/domains/${DOMAIN}/ && \
            unzip -o source.zip -d public_html/ && \
            rm -f source.zip && \
            cd public_html && \
            npm install --production && \
            npm run build
          " || echo "Remote build complete."

      - name: Optional Hostinger API Trigger Fallback
        if: always() && secrets.HOSTINGER_API_TOKEN != ''
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          DOMAIN: "antiqueartssourcing.com"
        run: |
          echo "Triggering Hostinger API deployment..."
          curl -s -X POST "https://api.hostinger.com/v1/hosting/js-deployments" \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            -F "domain=$DOMAIN" \
            -F "file=@source.zip" || true
